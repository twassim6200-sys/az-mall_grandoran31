header{padding:60px 20px 24px;max-width:1100px;margin:auto}
h1{font-family:Outfit,Inter,sans-serif;font-size:clamp(30px,6vw,52px);margin:0;line-height:1.2}
header p{color:var(--mute);margin:8px 0 0;max-width:520px}
.bar{max-width:1100px;margin:auto;padding:0 20px 8px;display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:12px 16px;border:1px solid rgba(255,255,255,.4);border-radius:12px;background:rgba(255,255,255,.92);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.65);color:var(--ink);padding:6px 16px;border-radius:99px;font:inherit;cursor:pointer}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
main{max-width:1100px;margin:auto;padding:16px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.tile{background:rgba(255,255,255,.90);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:18px 10px 12px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);transition:transform .15s,border-color .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:var(--brand);outline:none}
.logo{width:76px;height:76px;margin:0 auto 8px;border-radius:22%;display:grid;place-items:center;font-family:Outfit,sans-serif;font-size:30px;color:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.tile b{display:block;font-size:15px}
.tile small{color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
dialog{border:none;border-radius:20px;padding:0;max-width:420px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{padding:28px 24px 24px;text-align:center}
.sheet .logo{width:96px;height:96px;font-size:40px}
.sheet h2{margin:6px 0 2px;font-family:Outfit,sans-serif}
.tag{display:inline-block;background:var(--gold);color:#14202B;border-radius:99px;padding:0 12px;font-size:13px;font-weight:600}
.sheet p{color:var(--mute);margin:14px 0}
.meta{border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.close{margin-top:14px;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:10px 28px;font:inherit;cursor:pointer}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 2px;direction:ltr}
.stars button{background:none;border:0;cursor:pointer;padding:2px;font-size:28px;line-height:1;color:#d5dedc;transition:transform .1s}
.stars button:hover{transform:scale(1.15)}
.stars button.on{color:var(--gold)}
footer{text-align:center;color:#eaf1f0;font-size:13px;padding:0 20px 40px}

.hours{color:#eaf1f0;font-size:14px;margin:4px 0 0;font-weight:600}
.section-title{max-width:1100px;margin:28px auto 10px;padding:0 20px;color:#fff;font-family:Outfit,Inter,sans-serif;font-size:22px}
.events{max-width:1100px;margin:0 auto;padding:0 20px 8px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.event-card{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,.4)}
.event-card b{display:block;font-size:15px;margin-bottom:4px}
.event-card span{color:var(--mute);font-size:13px}
.chips2{max-width:1100px;margin:0 auto;padding:0 20px 14px;display:flex;gap:8px;overflow-x:auto}
.chips2 button{flex:none;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.65);color:var(--ink);padding:6px 16px;border-radius:99px;font:inherit;cursor:pointer}
.chips2 button.on{background:var(--brand);border-color:var(--brand);color:#fff}

.event-card img{width:100%;border-radius:10px;margin-bottom:10px;display:block;cursor:zoom-in}
.event-card .when{display:block;font-style:normal;font-weight:600;color:var(--brand);font-size:13px;margin-bottom:4px}
#lb{max-width:480px;background:transparent}
#lb img{width:100%;display:block;border-radius:16px}

.lang{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:16px;z-index:10;background:rgba(255,255,255,.92);color:#14202B;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:6px 18px;font:inherit;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
html[lang="ar"] body,html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] .section-title,html[lang="ar"] input,html[lang="ar"] button{font-family:Cairo,Tahoma,sans-serif}
html[lang="ar"] .stars button{font-family:system-ui,sans-serif}

footer{padding:28px 20px 44px}
.foot-logo{display:inline-block;background:#fff;border-radius:14px;padding:12px 20px}
.foot-logo img{height:44px;width:auto;display:block}
footer p{margin:14px 0 0}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.socials a{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);color:#14202B;text-decoration:none;font-weight:600;font-size:14px;padding:8px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.5)}
.socials a:hover{background:#fff}
footer .copy{opacity:.75}
</style>
</head>

function renderEvents(){
 var box=document.getElementById("events");
 box.innerHTML=EVENTS.map(function(e,i){
   var x=(LANG==="ar"&&e.ar)||e;
   return '<div class="event-card">'+(e.img?'<img src="'+e.img+'" alt="'+x.title+'" data-i="'+i+'">':'')+'<b>'+x.title+'</b>'+(x.date?'<em class="when">'+x.date+'</em>':'')+'<span>'+x.desc+'</span></div>';
 }).join('');
 box.querySelectorAll("img").forEach(function(im){im.onclick=function(){document.getElementById("lbimg").src=im.src;document.getElementById("lb").showModal()}});
}

var LANG="en";try{var sv=localStorage.getItem("azlang");if(sv==="ar"||sv==="en")LANG=sv}catch(e){}
function t(k){return T[LANG][k]}
function tc(c){return (LANG==="ar"&&AR_CAT[c])||c}
function tf(f){return (LANG==="ar"&&AR_FLOOR[f])||f}
function td(s){return (LANG==="ar"&&AR_DESC[s.name])||s.desc}


var cat="All",floor="All",term="",grid=document.getElementById("grid"),dlg=document.getElementById("dlg");
function logo(s){return '<div class="logo" style="background:'+s.color+'">'+(s.logo?'<img src="'+s.logo+'" alt="'+s.name+'">':s.name.trim().charAt(0))+'</div>'}
var FLOOR_ORDER=["Ground Floor","First Floor","Second Floor","Third Floor"];
function chips(){var cs=["All"].concat(STORES.map(function(s){return s.cat}).filter(function(v,i,a){return a.indexOf(v)===i}));
 var c=document.getElementById("chips");c.innerHTML="";
 cs.forEach(function(x){var b=document.createElement("button");b.textContent=x==="All"?t("all"):tc(x);if(x===cat)b.className="on";b.onclick=function(){cat=x;chips();render()};c.appendChild(b)})}
function floorChips(){var fs=["All"].concat(FLOOR_ORDER.filter(function(f){return STORES.some(function(s){return s.floor===f})}));
 var c=document.getElementById("floorChips");c.innerHTML="";
 fs.forEach(function(x){var b=document.createElement("button");b.textContent=x==="All"?t("all"):tf(x);if(x===floor)b.className="on";b.onclick=function(){floor=x;floorChips();render()};c.appendChild(b)})}
function render(){var q=term.toLowerCase();
 var list=STORES.filter(function(s){return(cat==="All"||s.cat===cat)&&(floor==="All"||s.floor===floor)&&(s.name.toLowerCase().indexOf(q)>-1||(s.alt||"").toLowerCase().indexOf(q)>-1||tc(s.cat).toLowerCase().indexOf(q)>-1)});
 grid.innerHTML=list.length?"":'<div class="empty">'+t("empty")+'</div>';
 list.forEach(function(s){var b=document.createElement("button");b.className="tile";b.innerHTML=logo(s)+"<b>"+s.name+"</b><small>"+tc(s.cat)+"</small>";b.onclick=function(){open(s)};grid.appendChild(b)})}
function starsHtml(){var h="";for(var i=1;i<=5;i++){h+='<button type="button" data-v="'+i+'">\u2605</button>'}return '<div class="stars" id="stars">'+h+'</div>'}
function open(s){document.getElementById("sheet").innerHTML=logo(s)+"<h2>"+s.name+'</h2><span class="tag">'+tc(s.cat)+"</span><p>"+td(s)+'</p>'+(s.floor?'<div class="meta">'+tf(s.floor)+(s.unit?" · "+s.unit:"")+'</div>':'')+starsHtml()+'<button class="close" id="x">'+t("close")+'</button>';
 dlg.showModal();document.getElementById("x").onclick=function(){dlg.close()};
 var btns=document.querySelectorAll("#stars button");
 btns.forEach(function(b){b.onclick=function(){var v=+b.dataset.v;btns.forEach(function(bb){bb.classList.toggle("on",+bb.dataset.v<=v)})}})}
function applyLang(){
 var d=document.documentElement;d.lang=LANG;d.dir=LANG==="ar"?"rtl":"ltr";
 document.getElementById("sub").textContent=t("sub");
 document.getElementById("hrs").textContent=t("hours");
 var q=document.getElementById("q");q.placeholder=t("search");q.setAttribute("aria-label",t("search"));
 document.getElementById("tOffers").textContent=t("offers");
 document.getElementById("tBrowse").textContent=t("browse");
 document.getElementById("lang").textContent=t("btn");
 document.getElementById("fFollow").textContent=t("follow");
 chips();floorChips();renderEvents();render();
}
document.getElementById("lang").onclick=function(){LANG=LANG==="en"?"ar":"en";try{localStorage.setItem("azlang",LANG)}catch(e){}applyLang()};
document.getElementById("lb").addEventListener("click",function(){this.close()});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
document.getElementById("q").oninput=function(e){term=e.target.value.trim();render()};
applyLang();
</script>
